name: Automated Dependency Updates

on:
  schedule:
    # Mon-Fri 2:00 AM ET (07:00 UTC)
    - cron: "0 7 * * 1-5"
  workflow_dispatch:

# Every write (branch push, PR create, PR merge) now uses the izg-dependency-bot App
# token. GITHUB_TOKEN is left with read access only, for Maven dependency resolution.
permissions:
  contents: read

env:
  # Pulls the vulnerability count out of the Dependency-Check HTML report. As of
  # dependency-check 13.0.0 the report renders it as:
  #   <li><i>Vulnerabilities Found</i>:&nbsp;0</li>
  # The earlier pattern, 'vulnerabilities found: \K[0-9]+', matched nothing against this
  # format, so the count silently read as empty. Used with grep -oiP, this tolerates a
  # missing </i>, a space before the colon, and &nbsp; or plain whitespace after it.
  # Do not match "Vulnerable Dependencies" — that is a different metric.
  # "Vulnerabilities Found" already excludes the suppressed entries.
  VULN_COUNT_PATTERN: 'Vulnerabilities Found(?:</i>)?\s*:(?:&nbsp;|\s)*\K[0-9]+'

jobs:
  dependency-updates:
    runs-on: ubuntu-latest
    steps:
      # A GitHub App installation token is used instead of secrets.GITHUB_TOKEN for all
      # git push / gh operations. Two reasons:
      #   1. A pull request opened by github-actions[bot] lands in "action_required" and
      #      waits for a human to click "Approve and run" (repo policy is
      #      fork-pr-contributor-approval = first_time_contributors). An App-authored PR
      #      is not subject to that gate.
      #   2. GitHub does not start new workflow runs from events raised by GITHUB_TOKEN.
      #      A merge made with GITHUB_TOKEN would push to develop silently, so publish.yml
      #      would never run and the BOM would never deploy to GitHub Packages.
      # The izg-dependency-bot App holds only contents:write, pull_requests:write,
      # checks:read and statuses:read. It deliberately does NOT hold workflows:write.
      # checks:read and statuses:read are required by the "gh pr checks" call below.
      - name: Generate Dependency Bot App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.DEPENDENCY_BOT_APP_ID }}
          private-key: ${{ secrets.DEPENDENCY_BOT_APP_KEY }}

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
          server-id: github

      - name: Set up Maven 3.9.14
        uses: stCarolas/setup-maven@v5.1
        with:
          maven-version: 3.9.14

      - name: Configure Maven authentication
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>github-bom</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Read automation exclusions
        run: |
          # Strip comments and blank lines, join with comma for --excludes argument
          EXCLUDES=$(grep -v '^\s*#' automation-exclusions.txt | grep -v '^\s*$' | paste -sd ',' -)
          echo "EXCLUDES=$EXCLUDES" >> $GITHUB_ENV
          echo "Excluding from automation: $EXCLUDES"

      - name: Detect available property version updates
        run: |
          echo "--- Available property updates ---"
          mvn -B versions:display-property-updates \
            -DallowMajorUpdates=false \
            -DallowMinorUpdates=true \
            -DallowIncrementalUpdates=true \
            -Dexcludes="${{ env.EXCLUDES }}" \
            | tee property-updates.log \
            | grep -E 'The following|->|\[INFO\] *$' || echo "(none found)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect available plugin version updates
        run: |
          echo "--- Available plugin updates ---"
          mvn -B versions:display-plugin-updates \
            -DallowMajorUpdates=false \
            -DallowMinorUpdates=true \
            -DallowIncrementalUpdates=true \
            | tee plugin-updates.log \
            | grep -E 'The following|->|\[INFO\] *$' || echo "(none found)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and resolve BOM dependencies (synthetic validation project)
        run: |
          mvn -B install -N -DskipDependencyCheck=true -DskipTests=true 2>&1 | tee resolve-pre-install.log
          mvn -B clean package -f validation/pom.xml -DskipDependencyCheck=true -DskipTests=true 2>&1 | tee resolve-pre-validation.log
          mvn -B dependency:copy-dependencies -f validation/pom.xml \
            -DoutputDirectory=target/dependency \
            -DincludeScope=runtime \
            -DskipDependencyCheck=true -q
          echo "All BOM-declared versions resolved and JAR dependencies copied successfully."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # PRE-UPDATE PHASE: capture baseline state before any changes
      # -----------------------------------------------------------------------

      - name: Capture pre-update dependency tree
        run: |
          mvn -B dependency:tree -f validation/pom.xml -DskipDependencyCheck=true \
            2>&1 | tee dependency-tree-pre.log
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect outdated transitive dependencies
        run: |
          set -o pipefail
          echo "--- Outdated transitive/direct dependency versions ---"
          mvn -B versions:display-dependency-updates \
            -f validation/pom.xml \
            -DallowMajorUpdates=false \
            -DallowMinorUpdates=true \
            -DallowIncrementalUpdates=true \
            -DskipDependencyCheck=true \
            -Dexcludes="${{ env.EXCLUDES }}" \
            2>&1 | tee dependency-updates-pre.log
          grep -E 'The following|->|\[INFO\] *$' dependency-updates-pre.log || echo "(none found)"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current date for NVD cache key
        id: date-pre
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache Dependency-Check NVD data (pre-update)
        uses: actions/cache@v6
        with:
          path: ~/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ steps.date-pre.outputs.date }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-

      - name: Pre-update CVE scan
        id: cve-scan-pre
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        timeout-minutes: 15
        with:
          project: "izgw-bom-validation-pre-update"
          path: "validation"
          format: "HTML"
          out: "dependency-check-report-pre"
          args: >
            --suppression /github/workspace/dependency-suppression.xml
            --disableOssIndex
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVDAPIKEY }}
            --disableNuspec
            --disableNugetconf
            --disableAssembly
            --disableCentral
        env:
          JAVA_HOME: /opt/jdk

      - name: Upload pre-update CVE report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report-pre-update
          path: dependency-check-report-pre/

      - name: Read pre-update CVE summary
        if: always()
        run: |
          REPORT="dependency-check-report-pre/dependency-check-report.html"
          if [ -f "$REPORT" ]; then
            VULN_COUNT=$(grep -oiP "$VULN_COUNT_PATTERN" "$REPORT" | head -1 || true)
            echo "CVE_SUMMARY_PRE=Pre-update scan: ${VULN_COUNT:-an unreadable number of} vulnerabilities found. See the \`dependency-check-report-pre-update\` artifact." >> $GITHUB_ENV
          else
            echo "CVE_SUMMARY_PRE=Pre-update CVE report not found — see workflow logs." >> $GITHUB_ENV
          fi

      # -----------------------------------------------------------------------
      # APPLY PHASE: bump property-backed versions and detect unfixed transitives
      # -----------------------------------------------------------------------

      - name: Apply patch and minor version bumps
        id: apply-updates
        run: |
          # Snapshot pom.xml before update so we can diff what changed
          cp pom.xml pom.xml.before

          mvn -B versions:update-properties \
            -DallowMajorUpdates=false \
            -DallowMinorUpdates=true \
            -DallowIncrementalUpdates=true \
            -Dexcludes="${{ env.EXCLUDES }}" \
            -DgenerateBackupPoms=false \
            2>&1 | tee apply-updates.log

          # Build a markdown table of changed version properties for the PR body.
          # Parse the diff output into two associative arrays (old/new) keyed by
          # property name so that columns never shift regardless of diff ordering.
          declare -A OLD_VERS NEW_VERS
          while IFS= read -r line; do
            side="${line:0:1}"   # '<' = before, '>' = after
            prop=$(echo "$line" | grep -oP '(?<=<)[a-z][a-zA-Z0-9._-]+(?=\.version>)')
            ver=$(echo "$line"  | grep -oP '(?<=\.version>)[^<]+')
            [ -z "$prop" ] || [ -z "$ver" ] && continue
            if [ "$side" = "<" ]; then OLD_VERS["$prop"]="$ver"
            else                        NEW_VERS["$prop"]="$ver"
            fi
          done < <(diff pom.xml.before pom.xml | grep '^[<>]')

          CHANGES=""
          for prop in "${!NEW_VERS[@]}"; do
            old="${OLD_VERS[$prop]:-unknown}"
            new="${NEW_VERS[$prop]}"
            CHANGES+="| \`${prop}\` | \`${old}\` | \`${new}\` |"$'\n'
          done

          if [ -z "$CHANGES" ]; then
            echo "No version changes applied."
            echo "CHANGES_TABLE=" >> $GITHUB_ENV
            echo "HAS_CHANGES=false" >> $GITHUB_ENV
          else
            echo "Version properties updated:"
            echo "$CHANGES"
            {
              echo 'CHANGES_TABLE<<EOF'
              echo "| Property | Old Version | New Version |"
              echo "|----------|-------------|-------------|"
              echo "$CHANGES"
              echo 'EOF'
            } >> $GITHUB_ENV
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi

          # Also report excluded libraries and their latest available versions for visibility
          EXCLUDED_REPORT=""
          while IFS= read -r lib; do
            [[ -z "$lib" || "$lib" =~ ^# ]] && continue
            EXCLUDED_REPORT+="- \`$lib\` (manually managed — not updated automatically)"$'\n'
          done < automation-exclusions.txt
          {
            echo 'EXCLUDED_REPORT<<EOF'
            echo "$EXCLUDED_REPORT"
            echo 'EOF'
          } >> $GITHUB_ENV

          # ---- Auto-fix transitive dependencies that have no property override ----
          #
          # Parse dependency-updates-pre.log for lines of the form:
          #   [INFO]   groupId:artifactId ... oldVersion -> newVersion
          # For each, check whether any existing property in pom.xml already
          # governs that artifactId (i.e. ${artifactId.version} appears in pom.xml).
          # If not, derive a property name and inject both the <property> entry and
          # a <dependencyManagement> entry (no <scope>, letting Maven narrow naturally).
          # Property name rule:
          #   1. Try artifactId.version
          #   2. If that key already exists (different groupId), use groupId.artifactId.version
          #
          # Install xmlstarlet for XML-safe pom.xml editing
          sudo apt-get install -qq -y xmlstarlet > /dev/null

          AUTO_FIXED_TRANSITIVES=""
          MANUAL_TRANSITIVES=""

          while IFS= read -r line; do
            # Match lines like: [INFO]   groupId:artifactId ... oldVer -> newVer
            if echo "$line" | grep -qP '\[INFO\]\s+\S+:\S+\s+\S+\s+->\s+\S+'; then
              GROUP_ARTIFACT=$(echo "$line" | grep -oP '(?<=\[INFO\]\s{3})\S+:\S+' | head -1)
              [ -z "$GROUP_ARTIFACT" ] && continue
              GROUP_ID=$(echo "$GROUP_ARTIFACT" | cut -d: -f1)
              ARTIFACT_ID=$(echo "$GROUP_ARTIFACT" | cut -d: -f2)
              NEW_VERSION=$(echo "$line" | grep -oP '(?<=->\s)\S+' | head -1)
              [ -z "$NEW_VERSION" ] && continue

              # Skip if already governed by an existing property
              # (any ${*.version} reference in pom.xml for this artifactId)
              EXISTING_PROP=$(grep -oP "(?<=\\\$\{)[a-z][a-zA-Z0-9._-]+\.version(?=\})" pom.xml \
                | while IFS= read -r p; do
                    grep -qF "<artifactId>${ARTIFACT_ID}</artifactId>" pom.xml && \
                    grep -qF "\${$p}" pom.xml && echo "$p" || true
                  done | head -1 || true)
              [ -n "$EXISTING_PROP" ] && continue

              # Derive property name: prefer artifactId.version, fall back to groupId.artifactId.version
              PROP_NAME="${ARTIFACT_ID}.version"
              if grep -qF "<${PROP_NAME}>" pom.xml; then
                PROP_NAME="${GROUP_ID}.${ARTIFACT_ID}.version"
              fi

              # Insert <PROP_NAME>NEW_VERSION</PROP_NAME> before </properties>
              if xmlstarlet ed --inplace \
                  -s "/project/properties" -t elem -n "${PROP_NAME}" -v "${NEW_VERSION}" \
                  pom.xml 2>/dev/null; then

                # Insert <dependency> into <dependencyManagement><dependencies> before </dependencies>
                xmlstarlet ed --inplace \
                  -s "/project/dependencyManagement/dependencies" -t elem -n "dependency" -v "" \
                  -s "/project/dependencyManagement/dependencies/dependency[last()]" -t elem -n "groupId" -v "${GROUP_ID}" \
                  -s "/project/dependencyManagement/dependencies/dependency[last()]" -t elem -n "artifactId" -v "${ARTIFACT_ID}" \
                  -s "/project/dependencyManagement/dependencies/dependency[last()]" -t elem -n "version" -v "\${${PROP_NAME}}" \
                  pom.xml 2>/dev/null && \
                AUTO_FIXED_TRANSITIVES+="| \`${GROUP_ID}:${ARTIFACT_ID}\` | \`${PROP_NAME}\` | \`${NEW_VERSION}\` |"$'\n' || \
                MANUAL_TRANSITIVES+="- \`${GROUP_ARTIFACT}\` → \`${NEW_VERSION}\` — XML edit failed; manual entry required"$'\n'
              else
                MANUAL_TRANSITIVES+="- \`${GROUP_ARTIFACT}\` → \`${NEW_VERSION}\` — property insert failed; manual entry required"$'\n'
              fi
            fi
          done < dependency-updates-pre.log

          {
            echo 'AUTO_FIXED_TRANSITIVES<<EOF'
            if [ -n "$AUTO_FIXED_TRANSITIVES" ]; then
              echo "| Artifact | Property Added | Version |"
              echo "|----------|----------------|---------|"
              echo "$AUTO_FIXED_TRANSITIVES"
            else
              echo "_None — all transitives are already property-backed._"
            fi
            echo 'EOF'
          } >> $GITHUB_ENV

          {
            echo 'MANUAL_TRANSITIVES<<EOF'
            if [ -n "$MANUAL_TRANSITIVES" ]; then
              echo "$MANUAL_TRANSITIVES"
            else
              echo "_None._"
            fi
            echo 'EOF'
          } >> $GITHUB_ENV

          # If any transitives were auto-fixed, mark that we have changes to commit
          if [ -n "$AUTO_FIXED_TRANSITIVES" ]; then
            echo "HAS_CHANGES=true" >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # POST-UPDATE PHASE: validate and verify fixes
      # -----------------------------------------------------------------------

      # Same gate as publish.yml, run early so a bad bump fails here instead of after the
      # PR is opened. The "Detect outdated transitive dependencies" step above injects new
      # dependencyManagement entries, so this is not merely a formality.
      # Keep in sync with the identical step in publish.yml.
      - name: Check all dependencyManagement versions are property-backed
        run: |
          # Extract only the <dependencyManagement> block and check for hardcoded versions
          HARDCODED=$(awk '/<dependencyManagement>/,/<\/dependencyManagement>/' pom.xml \
            | grep -oP '(?<=<version>)(?!\$\{)[^<]+' || true)
          if [ -n "$HARDCODED" ]; then
            echo "ERROR: Hardcoded version(s) found in <dependencyManagement>:"
            echo "$HARDCODED"
            exit 1
          fi
          echo "All dependencyManagement versions are property-backed."

      - name: Build and resolve BOM dependencies after updates
        run: |
          mvn -B install -N -DskipDependencyCheck=true -DskipTests=true 2>&1 | tee resolve-post-install.log
          mvn -B clean package -f validation/pom.xml -DskipDependencyCheck=true -DskipTests=true 2>&1 | tee resolve-post-validation.log
          mvn -B dependency:copy-dependencies -f validation/pom.xml \
            -DoutputDirectory=target/dependency \
            -DincludeScope=runtime \
            -DskipDependencyCheck=true -q
          echo "All BOM-declared versions resolved and JAR dependencies copied successfully after update."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture post-update dependency tree and diff
        run: |
          mvn -B dependency:tree -f validation/pom.xml -DskipDependencyCheck=true \
            2>&1 | tee dependency-tree-post.log
          echo "--- Dependency tree diff (pre vs post update) ---"
          TREE_DIFF=$(diff dependency-tree-pre.log dependency-tree-post.log || true)
          if [ -z "$TREE_DIFF" ]; then
            echo "No dependency tree changes."
            echo "TREE_DIFF_SUMMARY=_No dependency tree changes._" >> $GITHUB_ENV
          else
            echo "$TREE_DIFF"
            {
              echo 'TREE_DIFF_SUMMARY<<EOF'
              echo '```diff'
              echo "$TREE_DIFF"
              echo '```'
              echo 'EOF'
            } >> $GITHUB_ENV
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Dependency-Check NVD data (post-update)
        uses: actions/cache@v6
        with:
          path: ~/dependency-check-data
          key: dependency-check-nvd-${{ runner.os }}-${{ steps.date-pre.outputs.date }}
          restore-keys: |
            dependency-check-nvd-${{ runner.os }}-

      - name: Post-update CVE scan
        id: cve-scan-post
        uses: dependency-check/Dependency-Check_Action@main
        continue-on-error: true
        timeout-minutes: 15
        with:
          project: "izgw-bom-validation-post-update"
          path: "validation"
          format: "HTML"
          out: "dependency-check-report-post"
          args: >
            --suppression /github/workspace/dependency-suppression.xml
            --disableOssIndex
            --failOnCVSS 7
            --nvdApiKey ${{ secrets.NVDAPIKEY }}
            --disableNuspec
            --disableNugetconf
            --disableAssembly
            --disableCentral
        env:
          JAVA_HOME: /opt/jdk

      - name: Upload post-update CVE report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report-post-update
          path: dependency-check-report-post/

      - name: Read post-update CVE summary
        if: always()
        run: |
          REPORT="dependency-check-report-post/dependency-check-report.html"
          if [ -f "$REPORT" ]; then
            VULN_COUNT=$(grep -oiP "$VULN_COUNT_PATTERN" "$REPORT" | head -1 || true)
            if [ -n "$VULN_COUNT" ]; then
              echo "CVE_SUMMARY_POST=Post-update scan: ${VULN_COUNT} vulnerabilities found. See the \`dependency-check-report-post-update\` artifact." >> $GITHUB_ENV
              if [ "$VULN_COUNT" -gt 0 ]; then
                echo "HAS_CVES=true" >> $GITHUB_ENV
                echo "HAS_CHANGES=true" >> $GITHUB_ENV
              fi
            else
              # The count is in the report but could not be parsed. An unreadable report is
              # not the same as a clean one, so record the state as unknown. The merge step
              # must not auto-merge on an unknown CVE state.
              echo "CVE_SUMMARY_POST=Post-update scan: the vulnerability count could not be read from the report. See the \`dependency-check-report-post-update\` artifact." >> $GITHUB_ENV
              echo "CVE_STATUS_UNKNOWN=true" >> $GITHUB_ENV
            fi
          else
            echo "CVE_SUMMARY_POST=Post-update CVE report not found — see workflow logs." >> $GITHUB_ENV
            echo "CVE_STATUS_UNKNOWN=true" >> $GITHUB_ENV
          fi

      - name: Fail build if post-update CVE scan failed or warn if report was not produced
        if: always()
        run: |
          OUTCOME="${{ steps.cve-scan-post.outcome }}"
          REPORT_EXISTS=false
          if compgen -G "dependency-check-report-post/*.html" > /dev/null 2>&1; then
            REPORT_EXISTS=true
          fi

          if [ "$OUTCOME" = "failure" ] && [ "$REPORT_EXISTS" = "true" ]; then
            echo "::error::Post-update CVE scan found vulnerabilities with CVSS >= 7. See the dependency-check-report-post-update artifact for details."
            exit 1
          elif [ "$OUTCOME" = "failure" ] && [ "$REPORT_EXISTS" = "false" ]; then
            echo "::warning::Post-update CVE scan failed and no report was produced. The scan may have timed out or encountered an error."
          elif [ "$OUTCOME" != "success" ] || [ "$REPORT_EXISTS" = "false" ]; then
            echo "::warning::Post-update CVE scan did not produce a report (outcome: $OUTCOME). Vulnerability status is unknown."
          else
            echo "Post-update CVE scan completed successfully."
          fi

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: debug-logs
          if-no-files-found: ignore
          path: |
            pom.xml
            pom.xml.before
            pr-body.md
            property-updates.log
            plugin-updates.log
            dependency-updates-pre.log
            dependency-tree-pre.log
            dependency-tree-post.log
            resolve-pre-install.log
            resolve-pre-validation.log
            apply-updates.log
            resolve-post-install.log
            resolve-post-validation.log
            dependency-check-report-pre/
            dependency-check-report-post/

      - name: Open pull request
        id: open-pr
        if: env.HAS_CHANGES == 'true'
        run: |
          BRANCH="dependency-updates-$(date +'%Y%m%d-%H-%M')"
          git config user.name "izg-dependency-bot[bot]"
          # 321530222 is the bot USER id (gh api '/users/izg-dependency-bot[bot]'), not the
          # App id. GitHub needs the user id in the noreply address to attribute the commit
          # to the bot account.
          git config user.email "321530222+izg-dependency-bot[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pom.xml
          git commit -m "chore(deps): automated dependency version bumps $(date +'%Y-%m-%d')"
          git push origin "$BRANCH"

          # Use the checked-in template and envsubst for variable substitution —
          # handles newlines, pipes, backticks and other special characters that break sed delimiters.
          export CHANGES_TABLE="${CHANGES_TABLE}"
          export AUTO_FIXED_TRANSITIVES="${AUTO_FIXED_TRANSITIVES}"
          export MANUAL_TRANSITIVES="${MANUAL_TRANSITIVES}"
          export TREE_DIFF_SUMMARY="${TREE_DIFF_SUMMARY}"
          export EXCLUDED_REPORT="${EXCLUDED_REPORT}"
          export CVE_SUMMARY_PRE="${CVE_SUMMARY_PRE}"
          export CVE_SUMMARY_POST="${CVE_SUMMARY_POST}"
          envsubst < .github/workflows/pr-body-template.md > pr-body.md

          LABELS="dependencies"
          if [ "$HAS_CVES" = "true" ]; then
            LABELS="dependencies,security"
          fi

          PR_URL=$(gh pr create \
            --base develop \
            --head "$BRANCH" \
            --title "chore(deps): automated dependency updates $(date +'%Y-%m-%d')" \
            --body-file pr-body.md \
            --label "$LABELS")

          echo "PR_URL=$PR_URL" >> $GITHUB_ENV
          echo "PR created: $PR_URL"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # The PR's own build-and-publish check is a second, independent gate. This job has
      # already run the same validation and CVE scan, so this is deliberate redundancy: it
      # confirms the committed pom.xml builds from a clean checkout, not just in this job's
      # working tree. The cost is roughly one extra publish.yml run per night (~2 minutes).
      #
      # Use the scan's --failOnCVSS 7 threshold, not the total vulnerability count.
      # Lower-severity CVEs retain the "security" label but do not block merging.
      # A failed scan or an unreadable CVE result must never allow an automatic merge.
      #
      # The merge is made with the App token, not GITHUB_TOKEN, so the resulting push to
      # develop does start publish.yml and the BOM is deployed to GitHub Packages.
      - name: Wait for the PR check, then merge
        if: env.HAS_CHANGES == 'true' && steps.cve-scan-post.outcome == 'success' && env.CVE_STATUS_UNKNOWN != 'true'
        timeout-minutes: 20
        run: |
          set -euo pipefail

          if [ -z "${PR_URL:-}" ]; then
            echo "::error::PR_URL is empty; refusing to merge."
            exit 1
          fi

          # gh pr create returns before GitHub registers the check run against the head
          # SHA. Without this loop, gh exits 1 with "no checks reported" for a check that
          # is seconds away from appearing. Only that message is retried — a check that
          # exists but is pending or failing must fall through to --watch below.
          for _ in $(seq 1 20); do
            OUT=$(gh pr checks "$PR_URL" 2>&1) && RC=0 || RC=$?
            if [ "$RC" -ne 1 ] || ! printf '%s' "$OUT" | grep -q 'no checks reported'; then
              break
            fi
            echo "No check run registered yet; waiting 15s."
            sleep 15
          done

          # gh classes ACTION_REQUIRED as a failure, not as pending. So if the
          # first_time_contributors approval gate still applies to this App, this command
          # fails fast and nothing is merged, rather than blocking for the 6-hour job cap.
          gh pr checks "$PR_URL" --watch --fail-fast --interval 20

          gh pr merge "$PR_URL" --squash --delete-branch
          echo "Merged: $PR_URL"
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Report PR left open for review
        if: env.HAS_CHANGES == 'true' && (steps.cve-scan-post.outcome != 'success' || env.CVE_STATUS_UNKNOWN == 'true')
        run: |
          if [ "${CVE_STATUS_UNKNOWN:-}" = "true" ]; then
            REASON="the post-update CVE scan result could not be read"
          else
            REASON="the post-update CVE scan did not succeed"
          fi
          echo "::warning::$PR_URL was not merged automatically because $REASON. Review and merge it manually."
